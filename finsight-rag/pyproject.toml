[project]
name = "finsight"
version = "0.1.0"
description = "FinSight RAG: grounded, cited Q&A over SEC filings (FinanceBench). Local-first, Claude optional."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # config, CLI, utilities
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=8.3",
  "tqdm>=4.66",
  # data
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  # ingestion
  "pymupdf>=1.24",
  # embeddings, reranking
  "sentence-transformers>=3.0",
  "torch>=2.3",
  # indexes
  "qdrant-client>=1.10",
  "bm25s>=0.2.13",
  # LLM providers and serving
  "anthropic",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
cohere = ["cohere>=5.13"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "ipykernel",
  "jupytext>=1.19.7",
  "jupyterlab>=4.6.6",
]

[project.scripts]
finsight = "finsight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

# On Linux (CI, Docker) install CPU-only torch wheels: much smaller than the CUDA build.
# macOS always uses the default PyPI wheels, which include MPS (Apple GPU) support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ are generated from scripts/ (make notebooks), which are linted instead.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Allow en dashes, the info icon and × used in docstrings and output.
allowed-confusables = ["–", "ℹ", "×"]

[tool.ruff.lint.per-file-ignores]
# Step scripts double as notebooks: a bare `P` at the end of a cell displays the parameters.
"**/scripts/*.py" = ["B018"]

[tool.ruff.lint.isort]
# Hooks run ruff from the git root (the parent folder), where `finsight` would otherwise be
# classified as third-party. Declaring it keeps import order identical from any directory.
known-first-party = ["finsight"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented pattern is `param: T = typer.Option(...)` in function defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models or the full data (deselected by default and in CI)"]
addopts = "-m 'not slow'"
